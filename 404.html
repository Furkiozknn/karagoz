<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#120906">
<title>Sayfa bulunamadı · Karagöz</title>
<style>
  html,body{margin:0;height:100%;background:#120906;color:#f3e5c0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;
    background:radial-gradient(ellipse at 50% 30%,#3a1a0e,#120906 70%)}
  main{max-width:420px;text-align:center;border:2px solid #8e5d26;border-radius:18px 6px 18px 6px;padding:28px 24px;background:#1c0e08;
    box-shadow:0 16px 44px rgba(0,0,0,.7)}
  h1{margin:0 0 8px;font-size:28px;color:#ffb000}
  p{margin:0 0 18px;line-height:1.5;color:#d8c29a}
  a{display:flex;align-items:center;justify-content:center;min-height:48px;margin:8px 0;border-radius:14px 4px 14px 4px;
    border:1.5px solid #8e5d26;color:#f3e5c0;text-decoration:none;font-weight:700}
  a.p{background:#b22222;border-color:#ffb000}
  a:focus-visible{outline:3px solid #ffb000;outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Perde kapandı</h1>
  <p>Aradığın sayfa bulunamadı. Adresi kontrol et ya da oyuna dön.</p>
  <a class="p" href="https://furkiozknn.github.io/karagoz/">Karagöz'ü oyna</a>
  <a href="https://furkiozknn.github.io/">Diğer oyunlar</a>
</main>
</body>
</html>
